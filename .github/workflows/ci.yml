name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        # Listed rather than globbed: builds drop fetched dependencies into
        # zig-pkg/ directories, including one under examples/protobuf/, and
        # their formatting is not ours to enforce.
        run: >
          zig fmt --check build.zig src gen/main.zig packaging/consumer
          examples/*.zig examples/protobuf/build.zig examples/protobuf/src

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test-unit --summary all

      - name: Integration tests
        # Real client/server over loopback TCP.
        run: zig build test-integration --summary all

      - name: Stub generator tests
        # The generator needs zig-protobuf, so it is opt-in; this is the only
        # job that builds it from the root project.
        run: zig build test-gen -Dgenerator=true --summary all

      - name: Protobuf example
        # Its own project, because zgrpc has no protobuf dependency and this
        # needs one. Running it here is what stops the README's protobuf
        # snippets from rotting, and it drives the real generated stubs.
        working-directory: examples/protobuf
        run: zig build run

      - name: Generated stubs are current
        # Runs protoc and the generator again and fails if the committed
        # output differs, so editing the generator or the .proto without
        # regenerating cannot reach main.
        working-directory: examples/protobuf
        run: |
          zig build gen-proto
          git diff --exit-code -- src

      - name: Compile benchmark
        # Built but not run: timings from a shared runner are too noisy to
        # assert on, but the code should still be kept compiling.
        run: zig build bench-build

      - name: Compile VPC benchmark
        run: zig build vpc

  package:
    name: consumable as a dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Verify the published package
        # Building here proves nothing about building *from* here: a consumer
        # gets only the files `paths` lists and runs build.zig as a dependency.
        # This fetches a tarball of HEAD into a throwaway project and calls it.
        run: ./packaging/verify.sh

  interop:
    name: grpc-go interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: interop/go.sum

      - name: Run grpc-go interop suite
        # The check that actually proves we speak gRPC rather than a dialect
        # our own client happens to agree with.
        run: ./interop/run.sh
