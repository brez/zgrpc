syntax = "proto3";

package helloworld;

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

message HelloTimesRequest {
  string name = 1;
  uint32 times = 2;
}

// `zig build gen-proto` turns this block into src/helloworld.zgrpc.zig: the
// method paths, a typed client, and the table of handlers a server takes.
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc SayHelloTimes (HelloTimesRequest) returns (stream HelloReply);
}
